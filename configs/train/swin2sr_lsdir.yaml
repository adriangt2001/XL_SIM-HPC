# Model configuration
model_name: Swin2SR
# model_config: configs/models/swin2srX4.json
# upscale: 4

# Dataset, preprocessing and postprocessing
dataset: data/LSDIR
test_size: 0.2
# batch_size: 8
num_workers: 8
first_crop: 1024
second_crop: 64

# Training
num_iterations: 500000
optimizer: adamw
lr: 2e-4
scheduler: cosine
warmup_iterations: 10000
warmup_lr: 1e-7
decay_iterations: [500000]
decay_factor: 1e-7
max_grad_norm: 1.0
valid_freq: 10000
save_freq: 10000
output_dir: runs
report_scalar_freq: 100
report_image_freq: 10000

# Simulator
# microscope_config: configs/simulator/lessnoise_microscope.yaml
