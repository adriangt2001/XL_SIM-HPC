# Model configuration
model_name: Swin2SR
in_num_channels: 25
out_num_channels: 1
window_size: 8
upscale: 2

# Dataset, preprocessing and postprocessing
dataset: data/LSDIR
split: validation
test_size: 0.99
batch_size: 8
num_workers: 8
first_crop: 1024
second_crop: 64

# Training
num_iterations: 510000
warmup_iterations: 10000
warmup_lr: 1e-6
lr: 1e-4
scheduler_milestones: [250000, 400000, 450000, 475000]
decay_factor: 0.5
max_grad_norm: 1.0
valid_freq: 5000
save_freq: 2500
output_dir: runs
report_scalar_freq: 100
report_image_freq: 5000

# Simulator
microscope_config: configs/simulator/default_microscope.yaml
noise_config: configs/simulator/default_noise.yaml

# Checkpoint
checkpoint: runs/Swin2SR/run_20260629_093149/best_ssim
